services:
  backend-dev:
    container_name: backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: 
      - sh
      - -c
      - "uv run alembic -c backend/alembic.ini upgrade head && uv run uvicorn app.main.app:create_app --factory --host 0.0.0.0 --port=8080 --reload --timeout-keep-alive 250"
      # - "uv run alembic -c backend/alembic.ini upgrade head && uv run gunicorn 'app.main.app:create_app()' --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8080 --workers 2 --timeout 250"
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/healthcheck"]
      interval: 30s
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env.dev
        required: True
    volumes:
      - .:/code
      - ./models:/code/models
    networks:
      - app_network
    depends_on:
      - postgres-dev
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "3"
    profiles:
      - dev

  postgres-dev:
    image: postgres:17-alpine
    container_name: postgres-dev
    command: ["postgres", "-c", "hba_file=/var/lib/postgresql/pg_hba.conf"]
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/var/lib/postgresql/pg_hba.conf
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "1"
    profiles:
      - dev
  
  frontend-dev:
      build:
        context: frontend/
        dockerfile: Dockerfile
      container_name: frontend-dev
      restart: always
      env_file:
        - path: .env.dev
          required: true
      volumes:
        - ./frontend:/code
      networks:
        - app_network
      depends_on:
        - backend-dev
      profiles:
        - dev

  nginx-dev:
    image: nginx:alpine
    container_name: nginx-dev
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    env_file:
      - .env.dev
    depends_on:
      - backend-dev
      - frontend-dev
    networks:
      - app_network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "2"
    profiles:
      - dev

volumes:
  postgres_data:
  ..:

networks:
  app_network:
    driver: bridge